<!DOCTYPE html>

  <head>

    <title>Meetali Kapse Homepage</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/cb88b54bf5.js"
      crossorigin="anonymous"
    ></script>
    <style>
      ::selection {
    background: #f29ad8;
    }
      :root {
        --primary-text-color: #000000;
        --secondary-text-color: #ffffff;
        --accent-color: #f29ad8;
        --accent-color-dark: #ee71c3;
        --vibrant-color: #e305ad;
      }
      .star-five {
        background: transparent;
        margin: 50px 0;
        position: relative;
        display: block;
        color: var(--secondary-text-color);
        width: 0px;
        height: 0px;
        border-right: 100px solid transparent;
        border-bottom: 70px solid var(--secondary-text-color);
        border-left: 100px solid transparent;
      }
      .star-five:before {
        border-bottom: 80px solid var(--secondary-text-color);
        border-left: 30px solid transparent;
        border-right: 30px solid transparent;
        background-color: transparent;
        position: absolute;
        height: 0;
        width: 0;
        top: -45px;
        left: -65px;
        display: block;
        content: "";
        transform: rotate(-35deg);
      }
      .star-five:after {
        background-color: transparent;
        position: absolute;
        display: block;
        color: var(--secondary-text-color);
        top: 3px;
        left: -105px;
        width: 0px;
        height: 0px;
        border-right: 100px solid transparent;
        border-bottom: 70px solid var(--secondary-text-color);
        border-left: 100px solid transparent;
        transform: rotate(-70deg);
        content: "";
      }
    </style>
  </head>
